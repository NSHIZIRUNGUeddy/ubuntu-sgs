header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;background:rgba(14,14,10,.94);border-bottom:1px solid var(--line)}

.hero{min-height:calc(100vh - 62px);display:flex;flex-direction:column;justify-content:center;padding:60px 5%;background:rgba(0,0,0,.38)}

.btn{display:inline-block;padding:12px 22px;border:1px solid var(--tx);background:var(--tx);color:#14140f;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;cursor:pointer;font-family:inherit}
.btn.o{background:transparent;color:var(--tx)}
.btn.s{padding:8px 14px}
section{padding:70px 5%;background:rgba(12,12,9,.58)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:6px 14px;border:1px solid var(--line);background:none;color:var(--mu);cursor:pointer;font-family:inherit;border-radius:99px}
.chip.on{background:var(--tx);color:#14140f}.chip{background:rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:#23231b;display:flex;align-items:center;justify-content:center;color:#5c5a48;font-weight:700;letter-spacing:.1em;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb b{text-transform:uppercase;letter-spacing:.05em}
.pr{color:var(--ac)}

.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;text-align:left}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.q{background:var(--card);border:1px solid var(--line);padding:20px}
.q p{margin:0 0 10px}.q span{color:var(--mu);font-size:.85rem}

.ct{display:flex;flex-wrap:wrap;gap:12px}
footer{background:rgba(10,10,7,.95);padding:30px 5%;border-top:1px solid var(--line);color:var(--mu);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 4%}
.ov.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);width:100%;max-width:720px;padding:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:42px;height:52px;object-fit:cover;background:#222}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st div{background:#0f0f10;border:1px solid var(--line);padding:14px}.st b{font-size:1.6rem;display:block}
pre{white-space:pre-wrap;font-family:inherit;color:var(--ac)}
label{font-size:.8rem;color:var(--mu)}

<main style="max-width:760px;margin:0 auto;padding:30px 4%">
<div class="box" id="login"><h2>Admin login</h2>
<label>Email</label><input id="em" type="email" autocomplete="username"><br><br>
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<p><button class="btn" id="lg">Log in</button> <span id="lm" style="color:#e8a090"></span></p></div>

<script>
const SB_URL='https://nuydkeunkfuimbcihehe.supabase.co', SB_KEY='sb_publishable_0FLnva5DY0prBZ8e8eyyJw_0eYD1WkH';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Number(n).toLocaleString('en-US')+' RWF';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=(window.supabase&&SB_URL.startsWith('http'))?supabase.createClient(SB_URL,SB_KEY):null;
let list=[],editing=null,img='';
function show(ok){$('#login').hidden=ok;$('#panel').hidden=!ok;if(ok)tab('p')}
function tab(t){$$('.tabs .chip').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['p','e','a'].forEach(x=>$('#t'+x).hidden=x!=t);if(t=='p')loadList();if(t=='a')stats()}

async function init(){
 if(!sb){$('#lm').textContent='Supabase is not set up yet. Add your URL and key first.';return}
 const {data}=await sb.auth.getSession();show(!!data.session)}

 const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)$('#lm').textContent=error.message;else show(true)}
$('#lg').onclick=login;$('#pw').onkeydown=e=>{if(e.key=='Enter')login()};

async function loadList(){
 const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
 if(error){$('#tp').innerHTML='<p>'+esc(error.message)+'</p>';return}
 list=data;
 $('#tp').innerHTML=(list.map(p=>`<div class="li"><div style="display:flex;gap:10px;align-items:center">${p.image_url?`<img src="${esc(p.image_url)}">`:'<img>'}<div><b>${esc(p.name)}</b><br><span style="color:var(--mu)">${esc(p.category)} · ${fmt(p.price)}${p.featured?'':' · hidden'}</span></div></div><div><button class="btn s o" data-ed="${p.id}">Edit</button> <button class="btn s o" data-dl="${p.id}">Delete</button></div></div>`).join('')||'<p>No products yet.</p>')+'<p><button class="btn s" id="addN">Add product</button></p>'}
$('#tp').onclick=async e=>{const t=e.target;
 if(t.id=='addN'){editing=null;form({});tab('e')}
 if(t.dataset.ed){editing=t.dataset.ed;form(list.find(p=>p.id==editing));tab('e')}
 if(t.dataset.dl&&confirm('Delete this product?')){const p=list.find(x=>x.id==t.dataset.dl);
  const {error}=await sb.from('products').delete().eq('id',p.id);if(error){alert(error.message);return}
  rmImg(p.image_url);loadList()}};
function form(p){$('#fn').value=p.name||'';$('#fc').value=p.category||'Tees';$('#fp').value=p.price||'';$('#fs').value=p.sizes||'S,M,L,XL';$('#fg').value=p.size_guide||'';$('#fx').checked=p.featured!==false;$('#ff').value='';img=p.image_url||'';$('#fm').textContent=''}
function rmImg(u){if(u&&u.includes('/products/'))sb.storage.from('products').remove([u.split('/products/').pop()])}
function shrink(f,w){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/webp',.82)};i.src=URL.createObjectURL(f)})}
$('#fsv').onclick=async()=>{const m=$('#fm');
 if(!$('#fn').value||!$('#fp').value){m.textContent='Add a name and price.';return}
 m.textContent='Saving...';
 try{let url=img;const f=$('#ff').files[0];
  if(f){const blob=await shrink(f,900),path=Date.now()+'.webp';
   const up=await sb.storage.from('products').upload(path,blob,{contentType:'image/webp'});if(up.error)throw up.error;
   url=sb.storage.from('products').getPublicUrl(path).data.publicUrl;if(img)rmImg(img)}
  const row={name:$('#fn').value,category:$('#fc').value,price:+$('#fp').value,sizes:$('#fs').value||'M',size_guide:$('#fg').value,image_url:url||null,featured:$('#fx').checked};
  const r=editing?await sb.from('products').update(row).eq('id',editing):await sb.from('products').insert(row);
  if(r.error)throw r.error;editing=null;tab('p')}

async function stats(){

 const day=new Date();day.setHours(0,0,0,0);const wk=new Date(Date.now()-7*864e5);
 const [t,d,w]=await Promise.all([c(q()),c(q().gte('created_at',day.toISOString())),c(q().gte('created_at',wk.toISOString()))]);
 $('#ta').innerHTML=`<div class="st"><div><b>${t}</b>Total visits</div><div><b>${d}</b>Today</div><div><b>${w}</b>Last 7 days</div></div><p style="color:var(--mu);font-size:.8rem">One visit is counted each time someone opens the site in a new browser session.</p>`}
init();
</script></body></html>
