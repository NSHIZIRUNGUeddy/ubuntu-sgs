header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;background:rgba(14,14,10,.94);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand img{height:34px;width:auto;display:none}
nav{display:flex;gap:18px;font-size:.85rem;color:var(--mu)}
nav a:hover{color:var(--tx)}
@media(max-width:640px){nav a:nth-child(n+4){display:none}}
.hero{min-height:calc(100vh - 62px);display:flex;flex-direction:column;justify-content:center;padding:60px 5%;background:rgba(0,0,0,.38)}
.hero small{letter-spacing:.3em;color:var(--mu);text-transform:uppercase}
.hero h1{font-size:clamp(2.6rem,10vw,6.5rem);line-height:.95;margin:.3em 0;text-transform:uppercase;letter-spacing:-.02em}
.hero p{max-width:480px;color:var(--mu)}
.btn{display:inline-block;padding:12px 22px;border:1px solid var(--tx);background:var(--tx);color:#14140f;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;cursor:pointer;font-family:inherit}
.btn.o{background:transparent;color:var(--tx)}
.btn.s{padding:8px 14px}
section{padding:70px 5%;background:rgba(12,12,9,.58)}
h2{font-size:1.7rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:6px 14px;border:1px solid var(--line);background:none;color:var(--mu);cursor:pointer;font-family:inherit;border-radius:99px}
.chip.on{background:var(--tx);color:#14140f}.chip{background:rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:#23231b;display:flex;align-items:center;justify-content:center;color:#5c5a48;font-weight:700;letter-spacing:.1em;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb b{text-transform:uppercase;letter-spacing:.05em}
.pr{color:var(--ac)}
select,input,textarea{width:100%;padding:9px;background:#0f0f10;color:var(--tx);border:1px solid var(--line);font-family:inherit;font-size:.9rem}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;text-align:left}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.q{background:var(--card);border:1px solid var(--line);padding:20px}
.q p{margin:0 0 10px}.q span{color:var(--mu);font-size:.85rem}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:700}
details p{color:var(--mu);margin:8px 0 0}
.ct{display:flex;flex-wrap:wrap;gap:12px}
footer{background:rgba(10,10,7,.95);padding:30px 5%;border-top:1px solid var(--line);color:var(--mu);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 4%}
.ov.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);width:100%;max-width:720px;padding:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:42px;height:52px;object-fit:cover;background:#222}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st div{background:#0f0f10;border:1px solid var(--line);padding:14px}.st b{font-size:1.6rem;display:block}
pre{white-space:pre-wrap;font-family:inherit;color:var(--ac)}
label{font-size:.8rem;color:var(--mu)}

.box{margin:0 auto 20px}body{font-family:"Courier Prime","Courier New",Courier,monospace}.pp{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:10px;border:1px solid var(--line)}.pc{background:#050504;max-width:150px;height:auto;display:block}.pp .chip{padding:5px 10px;font-size:.72rem}.pn{display:block;color:var(--mu);font-size:.75rem;margin-top:6px}</style>

<script>
const SB_URL='https://nuydkeunkfuimbcihehe.supabase.co', SB_KEY='sb_publishable_0FLnva5DY0prBZ8e8eyyJw_0eYD1WkH';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Number(n).toLocaleString('en-US')+' RWF';

 const {data}=await sb.auth.getSession();show(!!data.session)}

 const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)$('#lm').textContent=error.message;else show(true)}
$('#lg').onclick=login;$('#pw').onkeydown=e=>{if(e.key=='Enter')login()};

async function loadList(){
 const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});

 list=data;
 $('#tp').innerHTML=(list.map(p=>`<div class="li"><div style="display:flex;gap:10px;align-items:center">${p.image_url?`<img src="${esc(p.image_url)}">`:'<img>'}<div><b>${esc(p.name)}</b><br><span style="color:var(--mu)">${esc(p.category)} · ${fmt(p.price)}${p.featured?'':' · hidden'}</span></div></div><div><button class="btn s o" data-ed="${p.id}">Edit</button> <button class="btn s o" data-dl="${p.id}">Delete</button></div></div>`).join('')||'<p>No products yet.</p>')+'<p><button class="btn s" id="addN">Add product</button></p>'}
$('#tp').onclick=async e=>{const t=e.target;
 if(t.id=='addN'){editing=null;form({});tab('e')}

 if(t.dataset.dl&&confirm('Delete this product?')){const p=list.find(x=>x.id==t.dataset.dl);
  const {error}=await sb.from('products').delete().eq('id',p.id);if(error){alert(error.message);return}
  imgsOf(p).forEach(rmImg);loadList()}};
function form(p){$('#fn').value=p.name||'';$('#fc').value=p.category||'Tees';$('#fp').value=p.price||'';$('#fs').value=p.sizes||'S,M,L,XL';$('#fx').checked=p.featured!==false;$('#ff').value='';PP=[];$('#pp').innerHTML='';gal=imgsOf(p).slice();removed=[];drawGal();$('#fm').textContent=''}
function rmImg(u){if(u&&u.includes('/products/'))sb.storage.from('products').remove([u.split('/products/').pop()])}
function shrink(f,w){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/webp',.82)};i.src=URL.createObjectURL(f)})}
let PP=[],rb=null;
async function loadRB(){if(!rb){const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm');rb=m.removeBackground||m.default}return rb}
function loadImg(b){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(b)})}
function finish(src,al,er){
 const w=src.width,h=src.height,N=w*h;let e=new Uint8Array(N);for(let i=0;i<N;i++)e[i]=al[i]?1:0;
 for(let t=0;t<(er||1);t++){const n=new Uint8Array(N);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!e[i])continue;
   n[i]=((x>0&&!e[i-1])||(x<w-1&&!e[i+1])||(y>0&&!e[i-w])||(y<h-1&&!e[i+w]))?0:1}
  e=n}
 const lab=new Int32Array(N),sizes=[0],st=new Int32Array(N);let L=0;
 for(let s0=0;s0<N;s0++){if(!e[s0]||lab[s0])continue;L++;let sp=0,c=0;st[sp++]=s0;lab[s0]=L;
  while(sp){const i=st[--sp];c++;const x=i%w,y=(i/w)|0;
   if(x>0&&e[i-1]&&!lab[i-1]){lab[i-1]=L;st[sp++]=i-1}if(x<w-1&&e[i+1]&&!lab[i+1]){lab[i+1]=L;st[sp++]=i+1}
   if(y>0&&e[i-w]&&!lab[i-w]){lab[i-w]=L;st[sp++]=i-w}if(y<h-1&&e[i+w]&&!lab[i+w]){lab[i+w]=L;st[sp++]=i+w}}
  sizes.push(c)}
 let mx=0;for(const v of sizes)if(v>mx)mx=v;const minS=Math.max(mx*.12,N*.004);
 const a=new Float32Array(N);for(let i=0;i<N;i++)a[i]=(e[i]&&sizes[lab[i]]>=minS)?255:0;
 const out=document.createElement('canvas');out.width=w;out.height=h;const ox=out.getContext('2d'),id=src.getContext('2d').getImageData(0,0,w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;s+=(xx<0||yy<0||xx>=w||yy>=h)?a[y*w+x]:a[yy*w+xx];c++}
  d[(y*w+x)*4+3]=s/c}
 ox.putImageData(id,0,0);return out}
function edgeMap(src){
 const w=src.width,h=src.height,N=w*h,d=src.getContext('2d').getImageData(0,0,w,h).data,g=new Float32Array(N),b=new Float32Array(N),m=new Float32Array(N);
 for(let i=0;i<N;i++)g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,c=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=g[yy*w+xx];c++}}b[y*w+x]=s/c}
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,gx=-b[i-w-1]-2*b[i-1]-b[i+w-1]+b[i-w+1]+2*b[i+1]+b[i+w+1],gy=-b[i-w-1]-2*b[i-w]-b[i-w+1]+b[i+w-1]+2*b[i+w]+b[i+w+1];m[i]=Math.sqrt(gx*gx+gy*gy)/4}
 return m}
function autoCut(src,tol){
 const w=src.width,h=src.height,N=w*h,d=src.getContext('2d').getImageData(0,0,w,h).data;
 const med=v=>{const c=v.slice().sort((p,q)=>p-q);return c[c.length>>1]};
 const side=f=>{const r=[],g=[],b=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(f(x,y)){const p=(y*w+x)*4;r.push(d[p]);g.push(d[p+1]);b.push(d[p+2])}return [med(r),med(g),med(b)]};
 const T=side((x,y)=>y<3),Bm=side((x,y)=>y>=h-3),Lf=side((x,y)=>x<3),Rt=side((x,y)=>x>=w-3);
 const dist=i=>{const x=i%w,y=(i/w)|0,tx=x/(w-1),ty=y/(h-1),p=i*4;let s=0;for(let c=0;c<3;c++){const ref=.5*((1-ty)*T[c]+ty*Bm[c]+(1-tx)*Lf[c]+tx*Rt[c]),df=d[p+c]-ref;s+=df*df}return Math.sqrt(s)};
 let near=0,tot=0;for(let x=0;x<w;x++){for(const y of [0,h-1]){tot++;if(dist(y*w+x)<45)near++}}for(let y=1;y<h-1;y++){for(const x of [0,w-1]){tot++;if(dist(y*w+x)<45)near++}}
 const m=src._em||(src._em=edgeMap(src));
 const tries=[[tol,3],[tol*.65,2.5],[tol*.4,2],[Math.max(4,tol*.25),1.6]];let al,fg=0,k=0;
 for(;k<tries.length;k++){const [tl,E]=tries[k];
  const bar=new Uint8Array(N);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(m[i]>E){bar[i]=1;bar[i-1]=1;bar[i+1]=1;bar[i-w]=1;bar[i+w]=1}}
  const bg=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;
  const seed=i=>{if(!bg[i]&&dist(i)<tl){bg[i]=1;q[qt++]=i}},add=i=>{if(!bg[i]&&!bar[i]&&dist(i)<tl){bg[i]=1;q[qt++]=i}};
  for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x)}for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1)}
  while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0;if(x>0)add(i-1);if(x<w-1)add(i+1);if(y>0)add(i-w);if(y<h-1)add(i+w)}
  al=new Uint8Array(N);let c=0;for(let i=0;i<N;i++){if(!bg[i]){al[i]=255;c++}}fg=c/N;
  if(fg>=.07)break}
 return {canvas:finish(src,al,2),plain:near/tot>.9,ok:fg>=.07,tuned:k>0}}
async function aiCut(s,note){
 const fn=await loadRB(),blob=await new Promise(r=>s.work.toBlob(r,'image/png'));
 const out=await fn(blob,{output:{format:'image/png'},progress:(k,c,t)=>{if(t)note('Loading the AI: '+Math.round(c/t*100)+'%')}});
 const oi=await loadImg(out),w=s.work.width,h=s.work.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(oi,0,0,w,h);
 const ad=x.getImageData(0,0,w,h).data,N=w*h,al=new Uint8Array(N);
 for(let i=0;i<N;i++)al[i]=ad[i*4+3]>128?255:0;
 const bgc=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;const add=i=>{if(!al[i]&&!bgc[i]){bgc[i]=1;q[qt++]=i}};
 for(let xx=0;xx<w;xx++){add(xx);add((h-1)*w+xx)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
 while(qh<qt){const i=q[qh++],xx=i%w,y=(i/w)|0;if(xx>0)add(i-1);if(xx<w-1)add(i+1);if(y>0)add(i-w);if(y<h-1)add(i+w)}
 for(let i=0;i<N;i++)if(!al[i]&&!bgc[i])al[i]=255;
 return finish(s.work,al,1)}
function bboxOf(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 return x1>x0&&y1>y0?[x0,y0,x1-x0+1,y1-y0+1]:[0,0,w,h]}
function fitCanvas(c,trim){const [bx,by,bw,bh]=trim?bboxOf(c):[0,0,c.width,c.height],W=900,H=1125,k=Math.min(.88*W/bw,.88*H/bh,2),o=document.createElement('canvas');
 o.width=W;o.height=H;const x=o.getContext('2d');x.imageSmoothingQuality='high';const dw=bw*k,dh=bh*k;x.drawImage(c,bx,by,bw,bh,(W-dw)/2,(H-dh)/2,dw,dh);return o}
const fitBlob=(c,trim)=>new Promise(r=>fitCanvas(c,trim).toBlob(r,'image/webp',.92));
const blk=s=>$('#pp').children[PP.indexOf(s)];
function note(s,t){const b=blk(s);if(b)b.querySelector('.pn').textContent=t||''}
function setMode(s,m){s.mode=m;const b=blk(s);if(b)b.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x.dataset.pm==m))}
function paint(s){const b=blk(s);if(!b||!s.work)return;const orig=s.mode=='orig'||!s.res,f=fitCanvas(orig?s.work:s.res,!orig),c=b.querySelector('canvas');c.width=150;c.height=188;const x=c.getContext('2d');x.clearRect(0,0,150,188);x.drawImage(f,0,0,150,188)}
function recalc(s){if(!s.work)return;
 if(s.mode=='orig'){s.res=s.work;note(s,'')}
 else{const r=autoCut(s.work,s.tol);
  if(!r.ok){setMode(s,'orig');s.res=s.work;note(s,'The item and the background look too alike to separate, so the original photo is kept. A darker or colored backdrop works best.')}
  else{s.res=r.canvas;note(s,r.tuned?'The background is close to the item, so a gentler cut was used. Check the preview.':(r.plain?'':'This background is not plain, so the cut may be rough. Try "Use AI".'))}}
 paint(s)}
async function prepare(s){const i=await loadImg(s.f),k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);s.work=c;recalc(s)}
$('#ff').onchange=()=>{PP=[...$('#ff').files].map(f=>({f,tol:18,mode:'auto',work:null,res:null,p:null}));
 $('#pp').innerHTML=PP.map(()=>`<div class="pp"><canvas class="pc" width="150" height="188"></canvas><div><div><button type="button" class="chip" data-pm="orig">Original</button> <button type="button" class="chip on" data-pm="auto">Remove background</button> <button type="button" class="chip" data-pm="ai">Use AI</button></div><label style="display:block;margin-top:8px">Strength <input type="range" min="5" max="70" value="18" data-ps style="width:160px"></label><small class="pn"></small></div></div>`).join('');
 PP.forEach(s=>{s.p=prepare(s)})};
$('#pp').addEventListener('click',async e=>{const t=e.target,b=t.closest('.pp');if(!b||!t.dataset.pm)return;const s=PP[[...$('#pp').children].indexOf(b)];
 await s.p;setMode(s,t.dataset.pm);
 if(s.mode=='ai'){note(s,'Loading the AI. The first time can take a minute or two...');
  s.p=aiCut(s,n=>note(s,n)).then(r=>{s.res=r;paint(s);note(s,'')}).catch(err=>{console.warn(err);setMode(s,'auto');recalc(s);note(s,'The AI could not run. Using Remove background instead.')})}
 else recalc(s)});
$('#pp').addEventListener('input',e=>{if(!e.target.hasAttribute('data-ps'))return;const s=PP[[...$('#pp').children].indexOf(e.target.closest('.pp'))];s.tol=+e.target.value;clearTimeout(s.t);s.t=setTimeout(()=>{if(s.mode=='auto'||(s.mode=='orig'&&s.autoFell)){setMode(s,'auto');recalc(s)}},120)});
$('#fsv').onclick=async()=>{const m=$('#fm'),b=$('#fsv');
 if(!$('#fn').value||!$('#fp').value){m.textContent='Add a name and price.';return}
 b.disabled=true;m.textContent='Saving...';
 try{const urls=gal.slice();
  for(let i=0;i<PP.length;i++){const s=PP[i];m.textContent='Uploading photo '+(i+1)+' of '+PP.length+'...';await s.p;
   let blob,tag='';
   if(s.mode=='orig'||!s.res){blob=await fitBlob(s.work,false)}else{blob=await fitBlob(s.res,true);tag='-cut'}
   const path=Date.now()+'-'+i+tag+'.webp';
   const up=await sb.storage.from('products').upload(path,blob,{contentType:blob.type||'image/webp'});if(up.error)throw up.error;
   urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl)}
  const row={name:$('#fn').value,category:$('#fc').value,price:+$('#fp').value,sizes:$('#fs').value||'M',images:urls,image_url:urls[0]||null,featured:$('#fx').checked};
  const r=editing?await sb.from('products').update(row).eq('id',editing):await sb.from('products').insert(row);
  if(r.error)throw r.error;
  removed.forEach(rmImg);removed=[];editing=null;PP=[];$('#pp').innerHTML='';tab('p')}
 catch(e){m.textContent='Error: '+(e.message||e)}
 b.disabled=false};
async function stats(){
 const q=()=>sb.from('visits').select('*',{count:'exact',head:true}),c=x=>x.then(r=>r.count||0);
 const day=new Date();day.setHours(0,0,0,0);const wk=new Date(Date.now()-7*864e5);
 const [t,d,w]=await Promise.all([c(q()),c(q().gte('created_at',day.toISOString())),c(q().gte('created_at',wk.toISOString()))]);
 $('#ta').innerHTML=`<div class="st"><div><b>${t}</b>Total visits</div><div><b>${d}</b>Today</div><div><b>${w}</b>Last 7 days</div></div><p style="color:var(--mu);font-size:.8rem">One visit is counted each time someone opens the site in a new browser session.</p>`}
